name: CI/CD

on:
  push:
    branches: ["**"]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # Тесты
  test:
    name: Тесты и проверка сборки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Проверка, что приложение импортируется
        run: python -c "from app.main import app; print('OK:', app.title)"

      - name: Запуск тестов (если есть папка tests)
        run: |
          if [ -d tests ]; then python -m pytest -v; else echo "Папки tests нет, пропускаем"; fi

  #Инструменты безопасности

  # SAST - Semgrep
  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # требуется для загрузки SARIF
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            semgrep/semgrep:latest \
            semgrep scan --config auto --sarif --output semgrep.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  #  Секреты - Gitleaks
  gitleaks:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks нужен полный git history

      - name: Run Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --report-format=sarif \
            --report-path=/repo/gitleaks.sarif --no-banner

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # SCA - Trivy по файловой системе
  trivy-fs:
    name: Trivy (filesystem / dependencies)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy fs scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"        # не валить пайплайн, только отчёт

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # Trivy по собранному образу
  trivy-image:
    name: Trivy (container image)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Build image for scan
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: calculator-api:scan

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: calculator-api:scan
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"        # CRITICAL/HIGH валят пайплайн, блокируя публикацию

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # Сборка и публикация (ожидает безопасности)
  build-and-publish:
    name: Сборка и публикация образа
    needs: [ test, semgrep, gitleaks, trivy-fs, trivy-image ]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # для создания git-тега и релиза
      packages: write   # для публикации в GHCR
    steps:
      - uses: actions/checkout@v4

      # Версия растёт автоматически при каждом пуше
      - name: Вычисление версии
        id: ver
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Сборка образа
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: calculator-api:test

      - name: Smoke-test контейнера
        run: |
          docker run -d --name calc -p 8000:8000 calculator-api:test
          for i in $(seq 1 15); do
            curl -sf http://localhost:8000/health > /dev/null && echo "API поднялся" && exit 0
            sleep 2
          done
          docker logs calc
          exit 1

      # Дальше только для main
      - name: Вход в GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Публикация образа
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Git-тег и релиз
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            --target "${{ github.sha }}" \
            --title "v${{ steps.ver.outputs.version }}" \
            --generate-notes